[project]
name = "immo"
version = "0.1.0"
description = "Persönliche Meta-Suche für Kapitalanlage-Immobilien (Analyse-Schicht über Fredy)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.22",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "ruamel.yaml>=0.18",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/immo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
